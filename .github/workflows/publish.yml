name: Publish

# Publishes @mcpskillsio/server to npm (with provenance via OIDC Trusted
# Publishing) and re-publishes io.mcpskills/server to the official MCP Registry
# (DNS-authenticated) on every v* tag.
#
# One-time setup required before the first tag:
#   1. npmjs.com -> @mcpskillsio/server -> Settings -> Trusted Publisher ->
#      GitHub Actions -> repo BeBraveBeKind/mcpskills-server, workflow publish.yml
#   2. Repo Settings -> Secrets -> Actions -> add MCP_REGISTRY_ED25519_KEY
#      (value is in Doppler: mcpskills/prd MCP_REGISTRY_ED25519_KEY)
#
# Release flow: bump package.json + index.js version literal + server.json
# (and packages[].version) together, commit, then: git tag vX.Y.Z && git push --tags

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # OIDC: npm Trusted Publishing + provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::git tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to npm (provenance via OIDC)
        run: npm publish --provenance --access public

      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Log in to MCP Registry (DNS)
        run: ./mcp-publisher login dns --domain mcpskills.io --private-key "${{ secrets.MCP_REGISTRY_ED25519_KEY }}"

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
